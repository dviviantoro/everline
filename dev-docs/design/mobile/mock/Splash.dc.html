<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#0A0D10;--surface:#12161B;--surface2:#171C22;--border:#232A32;--border2:#323C47;--text:#E8ECF1;--muted:#7C8A97;--accent:#F5A623;--accent-text:#F5A623;--on-accent:#0A0D10;--cyan:#22D3EE;--cyan-text:#22D3EE;--ok:#22C55E;--ok-text:#5FE0A0;--ok-bg:#0F2A1D;--warn-text:#F7B955;--warn-bg:#2B1F0A;--crit:#EF4444;--crit-text:#FF8A8A;--crit-bg:#2D1215;--grid:#141A21;--chart:#22D3EE;--glow:.22}
.app.light{--bg:#F2F4F6;--surface:#FFFFFF;--surface2:#EBEEF2;--border:#DCE1E7;--border2:#B4BDC8;--text:#0D1319;--muted:#56616D;--accent:#F5A623;--accent-text:#A85800;--on-accent:#0A0D10;--cyan:#0E8CA6;--cyan-text:#00758C;--ok:#16A45B;--ok-text:#0F6B3C;--ok-bg:#E0F4E9;--warn-text:#8A4B00;--warn-bg:#FDEED2;--crit:#D93636;--crit-text:#A8242A;--crit-bg:#FCE4E3;--grid:#E4E8ED;--chart:#0A86A0;--glow:.3}
.app a:focus-visible,.app button:focus-visible{outline:2px solid var(--cyan-text);outline-offset:2px}
.app .ring{opacity:0}
.app .glow{opacity:var(--glow)}
.app .tdot,.app .logo,.app .word,.app .bar{transform-box:fill-box;transform-origin:center}
.app .bar{transform-origin:left center}
@media (prefers-reduced-motion:no-preference){
.app .glow{animation:glowIn 1.1s ease-out both,glowPulse 2.6s ease-in-out 1.1s infinite}
.app .logo{animation:logoIn .95s cubic-bezier(.2,.9,.3,1.15) .1s both}
.app .ring{animation:ringOut 2.4s ease-out .5s infinite both}
.app .ring.r2{animation-delay:1.7s}
.app .word{animation:rise .6s ease-out .75s both}
.app .tag{animation:rise .6s ease-out .95s both}
.app .trace{animation:draw 1.1s ease-in-out 1.05s both}
.app .tdot{animation:pop .4s ease-out 1.95s both,dotPulse 2.6s ease-in-out 2.4s infinite}
.app .bar{animation:fill 2.4s cubic-bezier(.4,0,.2,1) .4s both}
.app .done{animation:rise .5s ease-out both}
}
@keyframes logoIn{0%{opacity:0;transform:scale(.55) translateY(10px)}60%{opacity:1;transform:scale(1.07) translateY(0)}100%{opacity:1;transform:scale(1)}}
@keyframes ringOut{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(2)}}
@keyframes glowIn{0%{opacity:0;transform:scale(.6)}100%{opacity:var(--glow);transform:scale(1)}}
@keyframes glowPulse{0%,100%{opacity:var(--glow);transform:scale(1)}50%{opacity:calc(var(--glow) * .55);transform:scale(1.12)}}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
@keyframes dotPulse{0%,100%{transform:scale(.75)}50%{transform:scale(1.35)}}
@keyframes fill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;padding:8px 20px 24px;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
    <button type="button" onClick="{{replay}}" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:transparent;color:var(--cyan-text);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      Replay
    </button>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;padding:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <sc-if value="{{show}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;align-items:center">

        <div style="position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center">
          <div class="glow" style="position:absolute;left:0;top:0;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle, var(--accent) 0%, transparent 68%)"></div>
          <div class="ring" style="position:absolute;left:40px;top:40px;width:120px;height:120px;box-sizing:border-box;border-radius:50%;border:2px solid var(--cyan)"></div>
          <div class="ring r2" style="position:absolute;left:40px;top:40px;width:120px;height:120px;box-sizing:border-box;border-radius:50%;border:2px solid var(--cyan)"></div>
          <div class="logo" style="position:relative;width:104px;height:104px">
            <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><img src="/_blob/5533abcdbf07e714ec7995a3bffa1148" alt="EverLine logo" width="104" height="104" style="display:block"></sc-if>
            <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><img src="/_blob/4622e4e811f6e6c0f8e284f97361f121" alt="EverLine logo" width="104" height="104" style="display:block"></sc-if>
          </div>
        </div>

        <div class="word" style="margin-top:4px;font-family:'Big Shoulders',sans-serif;font-size:52px;line-height:1;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase">Ever<span style="color:var(--accent-text)">Line</span></div>

        <svg class="tag" width="200" height="36" viewBox="0 0 200 36" style="margin-top:14px;display:block" aria-hidden="true">
          <path class="trace" pathLength="1" d="M0 28 L58 28 L80 8 L120 8 L142 28 L200 28" fill="none" style="stroke:var(--cyan)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="0"/>
          <circle class="tdot" cx="100" cy="8" r="5" style="fill:var(--ok)"/>
        </svg>

      </div>
    </sc-if>
  </div>

  <div style="min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px">
    <div aria-live="polite" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:24px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase">
      <sc-if value="{{signing}}" hint-placeholder-val="{{false}}"><span style="color:var(--cyan-text)">Signing you in&hellip;</span></sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{true}}">
        <span class="done" style="display:inline-flex;align-items:center;gap:8px;color:var(--ok-text)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          Signed in
        </span>
      </sc-if>
    </div>
    <div style="height:3px;border-radius:2px;background:var(--border);overflow:hidden">
      <sc-if value="{{show}}" hint-placeholder-val="{{true}}"><div class="bar" style="height:3px;border-radius:2px;background:var(--accent)"></div></sc-if>
    </div>
    <div style="min-height:56px">
      <sc-if value="{{done}}" hint-placeholder-val="{{true}}">
        <a class="done" href="Hotspot.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;text-decoration:none">
          Continue
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </a>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { themeMode: null, show: true, done: false };
componentDidMount() {
let saved = null;
try { saved = window.localStorage.getItem('everline-theme'); } catch (e) {}
if (saved === 'light' || saved === 'dark') this.setState({ themeMode: saved });
this._onStorage = (ev) => { if (ev.key === 'everline-theme' && (ev.newValue === 'light' || ev.newValue === 'dark')) this.setState({ themeMode: ev.newValue }); };
try { window.addEventListener('storage', this._onStorage); } catch (e) {}
this._startTimer();
}
componentWillUnmount() {
try { window.removeEventListener('storage', this._onStorage); } catch (e) {}
clearTimeout(this._t1);
clearTimeout(this._t2);
}
_startTimer() {
clearTimeout(this._t1);
this._t1 = setTimeout(() => this.setState({ done: true }), 2900);
}
renderVals() {
const mode = this.state.themeMode || this.props.theme || 'dark';
const dark = mode !== 'light';
return {
themeClass: dark ? 'dark' : 'light',
isDark: dark,
isLight: !dark,
show: this.state.show,
done: this.state.done,
signing: !this.state.done,
toggleLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
toggle: () => {
const next = dark ? 'light' : 'dark';
this.setState({ themeMode: next });
try { window.localStorage.setItem('everline-theme', next); } catch (e) {}
},
replay: () => {
clearTimeout(this._t1);
clearTimeout(this._t2);
this.setState({ show: false, done: false });
this._t2 = setTimeout(() => { this.setState({ show: true }); this._startTimer(); }, 80);
}
};
}
}
</script>
