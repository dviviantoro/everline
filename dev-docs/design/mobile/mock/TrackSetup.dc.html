<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracking setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#0A0D10;--surface:#12161B;--surface2:#171C22;--border:#232A32;--border2:#323C47;--text:#E8ECF1;--muted:#7C8A97;--accent:#F5A623;--accent-text:#F5A623;--on-accent:#0A0D10;--cyan:#22D3EE;--cyan-text:#22D3EE;--ok:#22C55E;--ok-text:#5FE0A0;--ok-bg:#0F2A1D;--warn-text:#F7B955;--warn-bg:#2B1F0A;--crit:#EF4444;--crit-text:#FF8A8A;--crit-bg:#2D1215;--grid:#141A21;--chart:#22D3EE}
.app.light{--bg:#F2F4F6;--surface:#FFFFFF;--surface2:#EBEEF2;--border:#DCE1E7;--border2:#B4BDC8;--text:#0D1319;--muted:#56616D;--accent:#F5A623;--accent-text:#A85800;--on-accent:#0A0D10;--cyan:#0E8CA6;--cyan-text:#00758C;--ok:#16A45B;--ok-text:#0F6B3C;--ok-bg:#E0F4E9;--warn-text:#8A4B00;--warn-bg:#FDEED2;--crit:#D93636;--crit-text:#A8242A;--crit-bg:#FCE4E3;--grid:#E4E8ED;--chart:#0A86A0}
.app a:focus-visible,.app button:focus-visible,.app input:focus-visible{outline:2px solid var(--cyan-text);outline-offset:2px}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;padding:8px 20px 24px">

  <div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
    <a href="Live.dc.html" style="display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:none;color:var(--cyan-text);font-size:15px;font-weight:500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Live
    </a>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;padding:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </div>

  <h1 style="margin:8px 0 0;font-family:'Big Shoulders',sans-serif;font-size:44px;line-height:0.95;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase">Tracking <span style="color:var(--accent-text)">mode</span></h1>
  <p style="margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--muted)">Walk the sensor along the line or cable. EverLine logs the charge at each step and shows whether it is rising or falling.</p>

  <section style="margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px">
    <div style="display:grid;grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);gap:12px;align-items:end">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-size:13px;font-weight:500">Asset</div>
        <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:4px;background:var(--surface2);border-radius:8px;padding:4px">
          <button type="button" aria-pressed="true" style="min-height:40px;border:0;border-radius:6px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--border2)">Line</button>
          <button type="button" aria-pressed="false" style="min-height:40px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer">Cable</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="asset-id" style="font-size:13px;font-weight:500">ID</label>
        <input id="asset-id" type="text" value="LN-0092" style="min-height:48px;box-sizing:border-box;width:100%;padding:0 12px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-size:13px;font-weight:500">Position</div>
      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:4px;background:var(--surface2);border-radius:8px;padding:4px">
        <button type="button" aria-pressed="true" style="min-height:44px;border:0;border-radius:6px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--border2)">Point marks</button>
        <button type="button" aria-pressed="false" style="min-height:44px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer">GPS distance</button>
      </div>
      <div style="font-size:13px;color:var(--muted)">Tap Mark point at each joint or marker you pass.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-size:13px;font-weight:500">Warning level</div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
        <button type="button" aria-pressed="false" style="min-height:48px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;cursor:pointer">50 mV</button>
        <button type="button" aria-pressed="true" style="min-height:48px;border:2px solid var(--accent);border-radius:6px;background:var(--warn-bg);color:var(--warn-text);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;cursor:pointer">100 mV</button>
        <button type="button" aria-pressed="false" style="min-height:48px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;cursor:pointer">150 mV</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div>
        <div style="font-size:15px;font-weight:500">Sound cue</div>
        <div style="margin-top:2px;font-size:13px;color:var(--muted)">Pitch rises with charge</div>
      </div>
      <button type="button" role="switch" aria-checked="true" aria-label="Sound cue" style="min-height:44px;min-width:60px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;cursor:pointer">
        <span style="position:relative;display:block;width:52px;height:32px;border-radius:16px;background:var(--accent)">
          <span style="position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:var(--on-accent)"></span>
        </span>
      </button>
    </div>
  </section>

  <section style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px">
    <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ok-text)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      Cantol streaming
    </span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)">Noise 12 mV</span>
  </section>

  <div style="margin-top:auto">
    <a href="Tracking.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;text-decoration:none">Start tracking</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { themeMode: null };
componentDidMount() {
let saved = null;
try { saved = window.localStorage.getItem('everline-theme'); } catch (e) {}
if (saved === 'light' || saved === 'dark') this.setState({ themeMode: saved });
this._onStorage = (ev) => { if (ev.key === 'everline-theme' && (ev.newValue === 'light' || ev.newValue === 'dark')) this.setState({ themeMode: ev.newValue }); };
try { window.addEventListener('storage', this._onStorage); } catch (e) {}
}
componentWillUnmount() {
try { window.removeEventListener('storage', this._onStorage); } catch (e) {}
}
renderVals() {
const mode = this.state.themeMode || this.props.theme || 'dark';
const dark = mode !== 'light';
return {
themeClass: dark ? 'dark' : 'light',
isDark: dark,
isLight: !dark,
toggleLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
toggle: () => {
const next = dark ? 'light' : 'dark';
this.setState({ themeMode: next });
try { window.localStorage.setItem('everline-theme', next); } catch (e) {}
}
};
}
}
</script>
</body>
</html>
