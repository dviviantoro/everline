<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to EverLine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#0A0D10;--surface:#12161B;--surface2:#171C22;--border:#232A32;--border2:#323C47;--text:#E8ECF1;--muted:#7C8A97;--accent:#F5A623;--accent-text:#F5A623;--on-accent:#0A0D10;--cyan:#22D3EE;--cyan-text:#22D3EE;--ok:#22C55E;--ok-text:#5FE0A0;--ok-bg:#0F2A1D;--warn-text:#F7B955;--warn-bg:#2B1F0A;--crit:#EF4444;--crit-text:#FF8A8A;--crit-bg:#2D1215;--grid:#141A21;--chart:#22D3EE}
.app.light{--bg:#F2F4F6;--surface:#FFFFFF;--surface2:#EBEEF2;--border:#DCE1E7;--border2:#B4BDC8;--text:#0D1319;--muted:#56616D;--accent:#F5A623;--accent-text:#A85800;--on-accent:#0A0D10;--cyan:#0E8CA6;--cyan-text:#00758C;--ok:#16A45B;--ok-text:#0F6B3C;--ok-bg:#E0F4E9;--warn-text:#8A4B00;--warn-bg:#FDEED2;--crit:#D93636;--crit-text:#A8242A;--crit-bg:#FCE4E3;--grid:#E4E8ED;--chart:#0A86A0}
.app a:focus-visible,.app button:focus-visible,.app input:focus-visible{outline:2px solid var(--cyan-text);outline-offset:2px}
.app input::placeholder{color:var(--muted)}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;padding:8px 20px 0">

  <div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
    <div style="display:flex;align-items:center;gap:10px;min-height:44px;color:var(--text)">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><img src="/_blob/5533abcdbf07e714ec7995a3bffa1148" alt="" width="26" height="26" style="display:block"></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><img src="/_blob/4622e4e811f6e6c0f8e284f97361f121" alt="" width="26" height="26" style="display:block"></sc-if>
      <span style="font-family:'Big Shoulders',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.01em">EverLine</span>
    </div>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;padding:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </div>

  <div style="margin-top:36px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:var(--cyan-text)">Field Survey Network</div>
  <h1 style="margin:14px 0 0;font-family:'Big Shoulders',sans-serif;font-size:58px;line-height:0.92;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase">Every reading, <span style="color:var(--accent-text)">on record.</span></h1>
  <p style="margin:16px 0 0;font-size:15px;line-height:1.6;color:var(--muted)">Sign in to review network condition, or log a field survey the moment you finish a patrol.</p>

  <div style="margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px">
    <div>
      <h2 style="margin:0;font-size:20px;font-weight:600">Sign in</h2>
      <p style="margin:4px 0 0;font-size:14px;color:var(--muted)">Enter the dashboard to review the network.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="email" style="font-size:13px;font-weight:500">Email</label>
      <input id="email" type="email" placeholder="you@example.com" style="min-height:52px;box-sizing:border-box;width:100%;padding:0 14px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font:inherit;font-size:16px">
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="password" style="font-size:13px;font-weight:500">Password</label>
      <input id="password" type="password" placeholder="Password" style="min-height:52px;box-sizing:border-box;width:100%;padding:0 14px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font:inherit;font-size:16px">
    </div>
    <a href="Splash.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;text-decoration:none">Sign in</a>
    <p style="margin:0;font-size:13px;line-height:1.5;color:var(--muted)">Internal proof-of-concept &mdash; any email and password will do.</p>
  </div>

  <div style="margin-top:6px;display:flex;justify-content:center">
    <a href="Hotspot.dc.html" style="display:inline-flex;align-items:center;min-height:48px;padding:0 16px;color:var(--cyan-text);font-size:15px;font-weight:500;text-decoration:none">Skip sign-in</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { themeMode: null };
componentDidMount() {
let saved = null;
try { saved = window.localStorage.getItem('everline-theme'); } catch (e) {}
if (saved === 'light' || saved === 'dark') this.setState({ themeMode: saved });
this._onStorage = (ev) => { if (ev.key === 'everline-theme' && (ev.newValue === 'light' || ev.newValue === 'dark')) this.setState({ themeMode: ev.newValue }); };
try { window.addEventListener('storage', this._onStorage); } catch (e) {}
}
componentWillUnmount() {
try { window.removeEventListener('storage', this._onStorage); } catch (e) {}
}
renderVals() {
const mode = this.state.themeMode || this.props.theme || 'dark';
const dark = mode !== 'light';
return {
themeClass: dark ? 'dark' : 'light',
isDark: dark,
isLight: !dark,
toggleLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
toggle: () => {
const next = dark ? 'light' : 'dark';
this.setState({ themeMode: next });
try { window.localStorage.setItem('everline-theme', next); } catch (e) {}
}
};
}
}
</script>
</body>
</html>
