<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live partial discharge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#0A0D10;--surface:#12161B;--surface2:#171C22;--border:#232A32;--border2:#323C47;--text:#E8ECF1;--muted:#7C8A97;--accent:#F5A623;--accent-text:#F5A623;--on-accent:#0A0D10;--cyan:#22D3EE;--cyan-text:#22D3EE;--ok:#22C55E;--ok-text:#5FE0A0;--ok-bg:#0F2A1D;--warn-text:#F7B955;--warn-bg:#2B1F0A;--crit:#EF4444;--crit-text:#FF8A8A;--crit-bg:#2D1215;--grid:#141A21;--chart:#22D3EE}
.app.light{--bg:#F2F4F6;--surface:#FFFFFF;--surface2:#EBEEF2;--border:#DCE1E7;--border2:#B4BDC8;--text:#0D1319;--muted:#56616D;--accent:#F5A623;--accent-text:#A85800;--on-accent:#0A0D10;--cyan:#0E8CA6;--cyan-text:#00758C;--ok:#16A45B;--ok-text:#0F6B3C;--ok-bg:#E0F4E9;--warn-text:#8A4B00;--warn-bg:#FDEED2;--crit:#D93636;--crit-text:#A8242A;--crit-bg:#FCE4E3;--grid:#E4E8ED;--chart:#0A86A0}
.app a:focus-visible,.app button:focus-visible{outline:2px solid var(--cyan-text);outline-offset:-2px}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column">

  <div style="padding:8px 20px 0;display:flex;align-items:center;justify-content:space-between;min-height:44px">
    <div style="display:flex;align-items:center;gap:10px">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><img src="/_blob/5533abcdbf07e714ec7995a3bffa1148" alt="" width="26" height="26" style="display:block"></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><img src="/_blob/4622e4e811f6e6c0f8e284f97361f121" alt="" width="26" height="26" style="display:block"></sc-if>
      <span style="font-family:'Big Shoulders',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.01em">EverLine</span>
    </div>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;padding:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </div>

  <div style="padding:14px 20px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
    <div>
      <h1 style="margin:0;font-family:'Big Shoulders',sans-serif;font-size:44px;line-height:0.95;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase">Live PD</h1>
      <div style="margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)">Cantol F03A1C &middot; 4 ms</div>
    </div>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok-text);font-size:13px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span>Connected</span>
  </div>

  <div style="flex:1;padding:16px 20px 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px;background:var(--surface2);border-radius:8px;padding:4px">
      <button type="button" aria-pressed="true" style="min-height:44px;border:0;border-radius:6px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px var(--border2)">Spot reading</button>
      <a href="TrackSetup.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:6px;color:var(--muted);font-size:14px;font-weight:500;text-decoration:none">Tracking mode</a>
    </div>

    <section style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 12px 8px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)">Phase-resolved &middot; 50 Hz</span>
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok-text)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Ref locked</span>
      </div>
      <svg width="100%" viewBox="0 0 330 190" role="img" aria-label="Phase-resolved partial discharge plot. Pulses cluster after the positive and negative zero crossings.">
        <g style="stroke:var(--grid)" stroke-width="1">
          <line x1="30" y1="20" x2="320" y2="20"/><line x1="30" y1="170" x2="320" y2="170"/>
          <line x1="30" y1="20" x2="30" y2="170"/><line x1="102.5" y1="20" x2="102.5" y2="170"/><line x1="175" y1="20" x2="175" y2="170"/><line x1="247.5" y1="20" x2="247.5" y2="170"/><line x1="320" y1="20" x2="320" y2="170"/>
        </g>
        <line x1="30" y1="95" x2="320" y2="95" style="stroke:var(--border2)" stroke-width="1"/>
        <path d="M30 95 C 54 40 150 40 175 95 C 199 150 295 150 320 95" fill="none" style="stroke:var(--chart)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <g style="fill:var(--accent)" fill-opacity="0.9">
          <circle cx="62" cy="78" r="3"/><circle cx="68" cy="64" r="3"/><circle cx="72" cy="72" r="3"/><circle cx="76" cy="52" r="3"/><circle cx="80" cy="66" r="3"/><circle cx="84" cy="58" r="3"/><circle cx="88" cy="74" r="3"/><circle cx="92" cy="48" r="3"/><circle cx="95" cy="62" r="3"/><circle cx="99" cy="70" r="3"/><circle cx="104" cy="56" r="3"/><circle cx="108" cy="80" r="3"/><circle cx="70" cy="84" r="3"/><circle cx="86" cy="86" r="3"/>
          <circle cx="208" cy="118" r="3"/><circle cx="214" cy="132" r="3"/><circle cx="219" cy="124" r="3"/><circle cx="224" cy="140" r="3"/><circle cx="229" cy="112" r="3"/><circle cx="233" cy="128" r="3"/><circle cx="238" cy="120" r="3"/><circle cx="242" cy="142" r="3"/><circle cx="246" cy="134" r="3"/><circle cx="251" cy="116" r="3"/><circle cx="256" cy="126" r="3"/><circle cx="212" cy="106" r="3"/><circle cx="236" cy="136" r="3"/><circle cx="226" cy="148" r="3"/>
        </g>
        <g style="fill:var(--muted)" fill-opacity="0.8">
          <circle cx="140" cy="88" r="2.5"/><circle cx="290" cy="100" r="2.5"/><circle cx="170" cy="92" r="2.5"/>
        </g>
        <g font-family="'IBM Plex Mono',monospace" font-size="11" text-anchor="middle" style="fill:var(--muted)">
          <text x="30" y="188">0&#176;</text><text x="102.5" y="188">90&#176;</text><text x="175" y="188">180&#176;</text><text x="247.5" y="188">270&#176;</text><text x="320" y="188">360&#176;</text>
        </g>
        <text x="2" y="14" font-family="'IBM Plex Mono',monospace" font-size="11" style="fill:var(--muted)">mV</text>
      </svg>
    </section>

    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">Peak</div>
        <div style="margin-top:4px;font-family:'Big Shoulders',sans-serif;font-size:36px;line-height:1;font-weight:700">182<span style="font-size:15px;font-weight:500;color:var(--muted)"> mV</span></div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">Rate</div>
        <div style="margin-top:4px;font-family:'Big Shoulders',sans-serif;font-size:36px;line-height:1;font-weight:700">312<span style="font-size:15px;font-weight:500;color:var(--muted)"> /s</span></div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">Noise</div>
        <div style="margin-top:4px;font-family:'Big Shoulders',sans-serif;font-size:36px;line-height:1;font-weight:700">12<span style="font-size:15px;font-weight:500;color:var(--muted)"> mV</span></div>
      </div>
    </div>
  </div>

  <div style="padding:16px 20px 16px;display:flex;flex-direction:column;gap:10px">
    <a href="Tag.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;text-decoration:none">Record 60 s</a>
    <button type="button" style="min-height:48px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text);font:inherit;font-size:15px;font-weight:500;cursor:pointer">Capture waveform</button>
  </div>

  <nav aria-label="Main" style="height:72px;box-sizing:border-box;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3, minmax(0, 1fr))">
    <a href="Connect.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/></svg>
      Device
    </a>
    <a href="Live.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 2px 0 var(--accent);text-decoration:none;color:var(--accent-text);font-size:12px;font-weight:600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      Live
    </a>
    <a href="Surveys.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      Surveys
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { themeMode: null };
componentDidMount() {
let saved = null;
try { saved = window.localStorage.getItem('everline-theme'); } catch (e) {}
if (saved === 'light' || saved === 'dark') this.setState({ themeMode: saved });
this._onStorage = (ev) => { if (ev.key === 'everline-theme' && (ev.newValue === 'light' || ev.newValue === 'dark')) this.setState({ themeMode: ev.newValue }); };
try { window.addEventListener('storage', this._onStorage); } catch (e) {}
}
componentWillUnmount() {
try { window.removeEventListener('storage', this._onStorage); } catch (e) {}
}
renderVals() {
const mode = this.state.themeMode || this.props.theme || 'dark';
const dark = mode !== 'light';
return {
themeClass: dark ? 'dark' : 'light',
isDark: dark,
isLight: !dark,
toggleLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
toggle: () => {
const next = dark ? 'light' : 'dark';
this.setState({ themeMode: next });
try { window.localStorage.setItem('everline-theme', next); } catch (e) {}
}
};
}
}
</script>
</body>
</html>
