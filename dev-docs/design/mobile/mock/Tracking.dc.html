<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracking along the line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#0A0D10;--surface:#12161B;--surface2:#171C22;--border:#232A32;--border2:#323C47;--text:#E8ECF1;--muted:#7C8A97;--accent:#F5A623;--accent-text:#F5A623;--on-accent:#0A0D10;--cyan:#22D3EE;--cyan-text:#22D3EE;--ok:#22C55E;--ok-text:#5FE0A0;--ok-bg:#0F2A1D;--warn-text:#F7B955;--warn-bg:#2B1F0A;--crit:#EF4444;--crit-text:#FF8A8A;--crit-bg:#2D1215;--grid:#141A21;--chart:#22D3EE}
.app.light{--bg:#F2F4F6;--surface:#FFFFFF;--surface2:#EBEEF2;--border:#DCE1E7;--border2:#B4BDC8;--text:#0D1319;--muted:#56616D;--accent:#F5A623;--accent-text:#A85800;--on-accent:#0A0D10;--cyan:#0E8CA6;--cyan-text:#00758C;--ok:#16A45B;--ok-text:#0F6B3C;--ok-bg:#E0F4E9;--warn-text:#8A4B00;--warn-bg:#FDEED2;--crit:#D93636;--crit-text:#A8242A;--crit-bg:#FCE4E3;--grid:#E4E8ED;--chart:#0A86A0}
.app a:focus-visible,.app button:focus-visible{outline:2px solid var(--cyan-text);outline-offset:2px}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column">

  <div style="padding:8px 20px 0;display:flex;align-items:center;justify-content:space-between;min-height:44px">
    <a href="TrackSetup.dc.html" style="display:inline-flex;align-items:center;gap:4px;min-height:44px;text-decoration:none;color:var(--cyan-text);font-size:15px;font-weight:500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Setup
    </a>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;padding:0">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></sc-if>
    </button>
  </div>

  <div style="padding:6px 20px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
    <div>
      <h1 style="margin:0;font-family:'Big Shoulders',sans-serif;font-size:44px;line-height:0.95;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase">Tracking</h1>
      <div style="margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)">LN-0092 &middot; 135 m walked</div>
    </div>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok-text);font-size:13px;font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span>Recording</span>
  </div>

  <div style="flex:1;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px">
    <section style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">Charge now &middot; M4 &middot; 135 m</div>
          <div style="margin-top:4px;font-family:'Big Shoulders',sans-serif;font-size:56px;line-height:0.9;font-weight:700">74<span style="font-size:18px;font-weight:500;color:var(--muted)"> mV</span></div>
        </div>
        <div style="text-align:right">
          <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--border2);color:var(--cyan-text);font-size:15px;font-weight:600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
            Falling
          </span>
          <div style="margin-top:6px;font-size:13px;color:var(--muted)">&minus;29% over last 15 m</div>
        </div>
      </div>
      <div style="background:var(--surface2);border-radius:6px;padding:12px;font-size:14px;line-height:1.5">
        Moving away from the strongest reading. Go back 45 m to M3 (182 mV).
      </div>
    </section>

    <section style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 12px 8px">
      <div style="padding:0 4px 6px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)">Charge along the line &middot; mV</div>
      <svg width="100%" viewBox="0 0 330 190" role="img" aria-label="Charge magnitude along line LN-0092. It rises from 12 millivolts at mark 1 to a peak of 182 at mark 3, then falls to 74 at mark 4, where you are now.">
        <g style="stroke:var(--grid)" stroke-width="1">
          <line x1="34" y1="135" x2="322" y2="135"/><line x1="34" y1="65" x2="322" y2="65"/>
        </g>
        <line x1="34" y1="170" x2="322" y2="170" style="stroke:var(--border2)" stroke-width="1"/>
        <line x1="34" y1="100" x2="322" y2="100" style="stroke:var(--accent)" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.9"/>
        <g font-family="'IBM Plex Mono',monospace" font-size="11" text-anchor="end" style="fill:var(--muted)">
          <text x="28" y="69">150</text><text x="28" y="139">50</text><text x="28" y="174">0</text>
        </g>
        <text x="40" y="94" font-family="'IBM Plex Mono',monospace" font-size="11" style="fill:var(--accent-text)">Warning 100 mV</text>
        <g style="stroke:var(--border2)" stroke-width="1">
          <line x1="34" y1="170" x2="34" y2="175"/><line x1="120.4" y1="170" x2="120.4" y2="175"/><line x1="206.8" y1="170" x2="206.8" y2="175"/><line x1="293.2" y1="170" x2="293.2" y2="175"/>
        </g>
        <g font-family="'IBM Plex Mono',monospace" font-size="11" text-anchor="middle" style="fill:var(--muted)">
          <text x="34" y="187">M1 0m</text><text x="120.4" y="187">M2 45m</text><text x="206.8" y="187">M3 90m</text><text x="293.2" y="187">M4 135m</text>
        </g>
        <path d="M34 161.6 L62.8 160.2 L91.6 157.4 L120.4 146.2 L149.2 119.6 L178 80.4 L206.8 42.6 L235.6 66.4 L264.4 97.2 L293.2 118.2" fill="none" style="stroke:var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <g style="fill:var(--chart)">
          <circle cx="34" cy="161.6" r="2.5"/><circle cx="62.8" cy="160.2" r="2.5"/><circle cx="91.6" cy="157.4" r="2.5"/><circle cx="120.4" cy="146.2" r="2.5"/><circle cx="149.2" cy="119.6" r="2.5"/><circle cx="178" cy="80.4" r="2.5"/><circle cx="235.6" cy="66.4" r="2.5"/><circle cx="264.4" cy="97.2" r="2.5"/>
        </g>
        <circle cx="206.8" cy="42.6" r="6" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>
        <text x="206.8" y="28" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" style="fill:var(--accent-text)">182 mV</text>
        <circle cx="293.2" cy="118.2" r="10" fill="none" style="stroke:var(--chart)" stroke-width="1.5" stroke-opacity="0.5"/>
        <circle cx="293.2" cy="118.2" r="5.5" style="fill:var(--text)"/>
        <text x="293.2" y="148" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" style="fill:var(--text)">You</text>
      </svg>
    </section>

    <section style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 16px">
      <div style="display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid var(--border)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-text)" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <span style="flex:1;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500">M1 &rarr; M2</span>
        <span style="font-size:14px;font-weight:600;color:var(--accent-text)">Rising +22 mV</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid var(--border)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-text)" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <span style="flex:1;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500">M2 &rarr; M3</span>
        <span style="font-size:14px;font-weight:600;color:var(--accent-text)">Rising +148 mV</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;min-height:38px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--cyan-text)" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        <span style="flex:1;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500">M3 &rarr; M4</span>
        <span style="font-size:14px;font-weight:600;color:var(--cyan-text)">Falling &minus;108 mV</span>
      </div>
    </section>
  </div>

  <div style="padding:14px 20px 22px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
    <button type="button" style="min-height:52px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text);font:inherit;font-size:16px;font-weight:500;cursor:pointer">Mark point</button>
    <a href="Surveys.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;text-decoration:none">Stop and save</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { themeMode: null };
componentDidMount() {
let saved = null;
try { saved = window.localStorage.getItem('everline-theme'); } catch (e) {}
if (saved === 'light' || saved === 'dark') this.setState({ themeMode: saved });
this._onStorage = (ev) => { if (ev.key === 'everline-theme' && (ev.newValue === 'light' || ev.newValue === 'dark')) this.setState({ themeMode: ev.newValue }); };
try { window.addEventListener('storage', this._onStorage); } catch (e) {}
}
componentWillUnmount() {
try { window.removeEventListener('storage', this._onStorage); } catch (e) {}
}
renderVals() {
const mode = this.state.themeMode || this.props.theme || 'dark';
const dark = mode !== 'light';
return {
themeClass: dark ? 'dark' : 'light',
isDark: dark,
isLight: !dark,
toggleLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
toggle: () => {
const next = dark ? 'light' : 'dark';
this.setState({ themeMode: next });
try { window.localStorage.setItem('everline-theme', next); } catch (e) {}
}
};
}
}
</script>
</body>
</html>
